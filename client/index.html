<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="A private photo app for your friend group — capture the year together, then relive it as your Wrapped." />
    <!-- Apply the saved theme and your colour before the first paint, so nothing flashes (lib/theme.ts and lib/member-colors.ts take over). -->
    <script>
      (function () {
        var theme = "system";
        try {
          theme = JSON.parse(localStorage.getItem("fw.device-settings") || "{}").theme || "system";
        } catch (error) {}
        var dark = theme === "dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#000000" : "#ffffff");
        try {
          var accent = JSON.parse(localStorage.getItem("fw.accent") || "null");
          if (accent) {
            document.documentElement.style.setProperty("--accent", accent[0]);
            document.documentElement.style.setProperty("--on-accent", accent[1]);
          }
        } catch (error) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Add to Home Screen: opens full screen like an app. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Wrapped" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Friendship Wrapped</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
