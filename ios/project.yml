# XcodeGen spec: the single source of truth for the Xcode project.
# On a Mac:  brew install xcodegen && xcodegen generate  (from this folder)
# The generated FriendshipWrapped.xcodeproj is gitignored.
name: FriendshipWrapped

options:
  bundleIdPrefix: com.nouzy5
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    # CI overrides this with the workflow run number so every TestFlight build is unique.
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # Your Apple Developer Team ID (Xcode → Settings → Accounts). CI passes it in instead.
    DEVELOPMENT_TEAM: ""

targets:
  FriendshipWrapped:
    type: application
    platform: iOS
    sources:
      - path: FriendshipWrapped
    # Apple push notifications. This says "development"; Xcode swaps in "production" when it signs
    # a TestFlight or App Store build. The App ID needs the Push Notifications capability (ios/README.md).
    entitlements:
      path: FriendshipWrapped/FriendshipWrapped.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        PRODUCT_NAME: FriendshipWrapped
        PRODUCT_BUNDLE_IDENTIFIER: com.nouzy5.friendshipwrapped
        INFOPLIST_FILE: FriendshipWrapped/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Settings → Appearance → App icon: Night, and one per member colour ("Your colour").
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Night AppIcon-Lime AppIcon-Cobalt AppIcon-Tomato AppIcon-Sun AppIcon-Bubblegum AppIcon-Mint AppIcon-Lilac AppIcon-Plum AppIcon-Sky AppIcon-Forest AppIcon-Tangerine AppIcon-Cherry"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
      configs:
        # Simulator → the API from `npm run dev` on the same Mac.
        Debug:
          FW_API_BASE_URL: "http://localhost:4000/api"
          FW_WEB_BASE_URL: "http://localhost:5173"
        # Must be HTTPS. Left empty on purpose: CI passes the deployed URLs in, and a
        # build without them shows "isn't connected to a server" instead of guessing.
        Release:
          FW_API_BASE_URL: ""
          FW_WEB_BASE_URL: ""

schemes:
  FriendshipWrapped:
    build:
      targets:
        FriendshipWrapped: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
