# Builds the iOS app on a macOS runner, so no Mac is needed locally.
#  - Every push (any branch, so PRs too) that touches ios/ gets a simulator build (compile check, no signing).
#  - Run it manually with "Test builds" ticked to get downloadable builds for testing without
#    an Apple Developer account: a simulator .app for Appetize.io and an unsigned .ipa for Sideloadly.
#  - Run it manually with "Upload to TestFlight" ticked to archive, sign and upload a build.
# Setup (Apple account, secrets, variables) is described in ios/README.md.
name: iOS

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      test_builds:
        description: "Test builds (Appetize .app + Sideloadly .ipa)"
        type: boolean
        default: false
      api_url:
        description: "Test builds: HTTPS API address, e.g. https://xyz.trycloudflare.com/api"
        type: string
        default: ""
      web_url:
        description: "Test builds: web client address for invite links (optional)"
        type: string
        default: ""
      testflight:
        description: "Upload to TestFlight"
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (simulator)
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project FriendshipWrapped.xcodeproj \
            -scheme FriendshipWrapped \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  test-builds:
    name: Test builds (Appetize + Sideloadly)
    if: github.event_name == 'workflow_dispatch' && inputs.test_builds
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    env:
      FW_API_BASE_URL: ${{ inputs.api_url }}
      FW_WEB_BASE_URL: ${{ inputs.web_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the API address
        run: |
          case "$FW_API_BASE_URL" in
            https://*) ;;
            *) echo "::error::Set api_url to an HTTPS address the phone can reach, e.g. a tunnel to your dev API (see ios/README.md)"; exit 1 ;;
          esac

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      # Appetize.io streams an iOS Simulator in the browser; it takes a zipped simulator .app.
      - name: Build simulator app
        run: |
          set -o pipefail
          xcodebuild build \
            -project FriendshipWrapped.xcodeproj \
            -scheme FriendshipWrapped \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/sim" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            FW_API_BASE_URL="$FW_API_BASE_URL" \
            FW_WEB_BASE_URL="$FW_WEB_BASE_URL"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/sim/Build/Products/Release-iphonesimulator/FriendshipWrapped.app" \
            "$RUNNER_TEMP/FriendshipWrapped-simulator.zip"

      # Sideloadly re-signs this with your own Apple ID when it installs it on your iPhone.
      - name: Build unsigned device .ipa
        run: |
          set -o pipefail
          xcodebuild archive \
            -project FriendshipWrapped.xcodeproj \
            -scheme FriendshipWrapped \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FriendshipWrapped.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            FW_API_BASE_URL="$FW_API_BASE_URL" \
            FW_WEB_BASE_URL="$FW_WEB_BASE_URL"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/FriendshipWrapped.xcarchive/Products/Applications/FriendshipWrapped.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$RUNNER_TEMP/FriendshipWrapped-unsigned.ipa" Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: FriendshipWrapped-simulator-appetize
          path: ${{ runner.temp }}/FriendshipWrapped-simulator.zip
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: FriendshipWrapped-ipa-sideloadly
          path: ${{ runner.temp }}/FriendshipWrapped-unsigned.ipa
          retention-days: 14

  testflight:
    name: Upload to TestFlight
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      FW_API_BASE_URL: ${{ vars.FW_API_BASE_URL }}
      FW_WEB_BASE_URL: ${{ vars.FW_WEB_BASE_URL }}
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.nouzy5.friendshipwrapped' }}
    steps:
      - uses: actions/checkout@v5

      - name: Check configuration
        run: |
          missing=0
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY FW_API_BASE_URL FW_WEB_BASE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set (see ios/README.md → TestFlight)"
              missing=1
            fi
          done
          case "$FW_API_BASE_URL" in
            https://*) ;;
            *) echo "::error::FW_API_BASE_URL must start with https://"; missing=1 ;;
          esac
          exit $missing

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Write App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/keys/AuthKey.p8"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" ExportOptions.plist

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project FriendshipWrapped.xcodeproj \
            -scheme FriendshipWrapped \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FriendshipWrapped.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            FW_API_BASE_URL="$FW_API_BASE_URL" \
            FW_WEB_BASE_URL="$FW_WEB_BASE_URL"

      - name: Upload to App Store Connect
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/FriendshipWrapped.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
